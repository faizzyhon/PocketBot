<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PocketBot demo</title>
<style>
  :root { --paper:#F4F1EA; --ink:#111; --blue:#1414CC; --line:#CFC8B8; --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --paper:#16150f; --ink:#f1ede2; --blue:#8c8cff; --line:#3a382d; } }
  * { box-sizing: border-box } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 var(--font); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; } h1 { font-size: 20px; margin: 0 0 4px }
  #meta { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--blue); min-height: 18px; margin-bottom: 12px }
  #log { border: 1.5px solid var(--ink); min-height: 280px; max-height: 60vh; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--paper) 94%, var(--ink)); }
  .m { padding: 8px 11px; border: 1.5px solid var(--ink); max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere } .me { align-self: flex-end; background: var(--blue); color: #fff; border-color: var(--blue) } .bot a { color: var(--blue); font-weight: 600 }
  form { display: flex; margin-top: 10px } input { flex: 1; min-width: 0; padding: 12px; font: inherit; border: 1.5px solid var(--ink); border-right: 0; background: var(--paper); color: var(--ink) } button { padding: 0 18px; font: 600 14px var(--font); border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer }
  button:disabled, input:disabled { opacity: .5; cursor: wait } small { color: var(--line) }
</style>
</head>
<body>
<main>
  <h1 id="title">PocketBot</h1>
  <div id="meta">Loading the model… (first visit downloads ~90 MB, then it is cached)</div>
  <div id="log" aria-live="polite"></div>
  <form id="f"><input id="q" placeholder="Ask a question…" autocomplete="off" disabled><button disabled>Send</button></form>
</main>
<script type="module">
import { load } from './pocketbot.js';
const $ = (id) => document.getElementById(id), log = $('log'), meta = $('meta'), q = $('q'), btn = document.querySelector('button');
const esc = (s) => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const html = (t) => esc(t).replace(/\[([^\]]+)\]\((\/[^)\s]*)\)/g, '<a href="$2">$1</a>');   // links to your own pages only
const add = (cls, text) => { const d = document.createElement('div'); d.className = 'm ' + cls; d.innerHTML = html(text); log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
let bot;
try {
  bot = await load(s => { if (s) meta.textContent = s; });
  $('title').textContent = bot.name;
  if (bot.backend === 'http') { document.title = bot.name; meta.textContent = 'ready · answers come from your HTTP provider; the built-in model is loaded only if it fails'; }
  else { document.title = bot.name + ' (offline)'; meta.textContent = `offline model ready · running on ${bot.backend === 'webgpu' ? 'your graphics card (WebGPU)' : 'the CPU (WebAssembly)'} · nothing leaves this tab`; }
  add('bot', 'Hi! Ask me something. Everything runs on your device.'); q.disabled = btn.disabled = false; q.focus();
} catch (e) { meta.textContent = 'Could not start the model: ' + (e.message || e); console.error(e); }
$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const text = q.value.trim(); if (!text || !bot) return; q.value = ''; q.disabled = btn.disabled = true; add('me', text);
  const bubble = add('bot', '…'); const t0 = performance.now();
  try {
    const r = await bot.answer(text, partial => { bubble.innerHTML = html(partial); log.scrollTop = log.scrollHeight; });
    bubble.innerHTML = html(r.text); meta.textContent = `${r.via}${r.stats ? ` · ${r.stats.newTokens} tokens · ${r.stats.perTokenMs} ms/token · ${bot.backend}` : ''} · ${Math.round(performance.now() - t0)} ms`;
  } catch (e) { bubble.textContent = 'Something went wrong: ' + (e.message || e); }
  q.disabled = btn.disabled = false; q.focus();
});
</script>
</body>
</html>
